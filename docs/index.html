<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c30">
  <title>Wayfinder · Web server lab</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111c30; color: #f2f3ed; font-family: "Segoe UI", Arial, sans-serif; }
    main { max-width: 1000px; margin: auto; padding: 40px 28px; }
    .brand { color: #d8f39c; letter-spacing: .16em; font-size: 13px; font-weight: 700; border-bottom: 1px solid #344057; padding-bottom: 28px; }
    section { padding: 100px 0 80px; max-width: 620px; }
    .eyebrow { font: 12px ui-monospace, Consolas, monospace; color: #d8f39c; letter-spacing: .12em; }
    h1 { font-size: clamp(42px, 7vw, 76px); line-height: 1.07; font-weight: 500; letter-spacing: -.05em; margin: 24px 0; }
    p { color: #a6b1c1; line-height: 1.8; font-size: 17px; }
    .button { display: inline-block; margin-top: 22px; background: #d8f39c; color: #18242d; padding: 16px 22px; border-radius: 4px; font-size: 14px; font-weight: 650; text-decoration: none; }
    .button:hover { background: #e7ffb7; }
    a:focus-visible { outline: 2px solid #d8f39c; outline-offset: 5px; }
    footer { border-top: 1px solid #344057; padding-top: 22px; color: #97a5b8; font: 12px ui-monospace, Consolas, monospace; }
    footer a { color: #d8f39c; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <header class="brand">WAYFINDER / WEB SERVER LAB</header>
    <section>
      <div class="eyebrow">HOLBERTON SCHOOL · ALU</div>
      <h1>A good route.<br>A better detour.</h1>
      <p>A web server should make a wrong turn feel less like a dead end.
        Explore the custom error page designed for the ALU web server assignment.</p>
      <a class="button" href="a-little-off-course">Take the scenic route ↗</a>
    </section>
    <footer>HTML &amp; CSS · <a href="https://github.com/fkangira/alu-system_engineering-devops/tree/master/web_server">View the source</a></footer>
  </main>
</body>
</html>
